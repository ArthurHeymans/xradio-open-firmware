[alias]
xtask = "run --locked --package xtask --"

[target.armv5te-none-eabi]
rustflags = ["-C", "target-feature=+strict-align", "-C", "link-arg=-Tlink-download.x"]

[target.thumbv5te-none-eabi]
rustflags = [
  "-C", "target-feature=+strict-align",
  "-C", "link-arg=-Tlink-main-low.x",
  "-Z", "emit-stack-sizes",
]
