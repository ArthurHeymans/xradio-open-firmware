<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="XR819 block diagram: SDIO host, HIF, packet RAM, MAC, PHY/RF, CPU and support blocks">
<defs>
<style>
.bx{fill:#ffffff;stroke:#9aa7b4;stroke-width:1.2;rx:5}
.bx2{fill:#eef4f8;stroke:#0a5c8a;stroke-width:1.4}
.lbl{font:12px -apple-system,Segoe UI,Roboto,sans-serif;fill:#16222e}
.lblb{font:bold 12px -apple-system,Segoe UI,Roboto,sans-serif;fill:#12263a}
.sm{font:10.5px -apple-system,Segoe UI,Roboto,sans-serif;fill:#4a5a6a}
.ln{stroke:#55697c;stroke-width:1.2;fill:none}
.arw{stroke:#55697c;stroke-width:1.2;fill:none;marker-end:url(#a)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#55697c"/>
</marker>
</defs>
<rect x="10" y="120" width="120" height="70" rx="5" fill="#ffffff" stroke="#9aa7b4"/>
<text class="lblb" x="70" y="146" text-anchor="middle">Host</text>
<text class="sm" x="70" y="162" text-anchor="middle">SDIO function</text>
<text class="sm" x="70" y="176" text-anchor="middle">+ Linux cw1200</text>

<rect x="160" y="112" width="120" height="86" class="bx2"/>
<text class="lblb" x="220" y="134" text-anchor="middle">HIF</text>
<text class="sm" x="220" y="150" text-anchor="middle">RX desc ring x32</text>
<text class="sm" x="220" y="164" text-anchor="middle">TX desc ring x4</text>
<text class="sm" x="220" y="178" text-anchor="middle">IRQ 13</text>

<rect x="312" y="86" width="150" height="138" class="bx"/>
<text class="lblb" x="387" y="108" text-anchor="middle">Packet SRAM</text>
<text class="sm" x="387" y="126" text-anchor="middle">runtime 0x0900_7000</text>
<text class="sm" x="387" y="140" text-anchor="middle">HIF in 30 x 0x660</text>
<text class="sm" x="387" y="154" text-anchor="middle">HIF out 4 x 0x180</text>
<text class="sm" x="387" y="168" text-anchor="middle">TX cmd 4 x 4 x 0x54</text>
<text class="sm" x="387" y="182" text-anchor="middle">responses + rate RAM</text>
<text class="sm" x="387" y="196" text-anchor="middle">RX FIFO 0x0940_0000</text>

<rect x="494" y="86" width="150" height="138" class="bx"/>
<text class="lblb" x="569" y="108" text-anchor="middle">MAC</text>
<text class="sm" x="569" y="126" text-anchor="middle">packet DMA (RX)</text>
<text class="sm" x="569" y="140" text-anchor="middle">4 TX pipes</text>
<text class="sm" x="569" y="154" text-anchor="middle">response engine</text>
<text class="sm" x="569" y="168" text-anchor="middle">TSF / EDCA</text>
<text class="sm" x="569" y="182" text-anchor="middle">address match</text>
<text class="sm" x="569" y="196" text-anchor="middle">event FIFO</text>

<rect x="676" y="112" width="120" height="86" class="bx"/>
<text class="lblb" x="736" y="134" text-anchor="middle">PHY + RF</text>
<text class="sm" x="736" y="150" text-anchor="middle">baseband</text>
<text class="sm" x="736" y="164" text-anchor="middle">calibration</text>
<text class="sm" x="736" y="178" text-anchor="middle">2.4 GHz radio</text>

<rect x="676" y="18" width="120" height="60" class="bx"/>
<text class="lblb" x="736" y="38" text-anchor="middle">AES / CCMP</text>
<text class="sm" x="736" y="54" text-anchor="middle">IRQ 18 / 20</text>
<text class="sm" x="736" y="68" text-anchor="middle">0x09c5_0000</text>

<rect x="160" y="18" width="302" height="60" class="bx"/>
<text class="lblb" x="311" y="38" text-anchor="middle">CPU: ARM966E-S, ITCM 0 / DTCM 0x0400_0000</text>
<text class="sm" x="311" y="54" text-anchor="middle">vendor image: low Thumb at 0, high support at 0xfff0_0000</text>
<text class="sm" x="311" y="68" text-anchor="middle">interrupt controller, timers, clock/reset, platform control</text>

<line x1="130" y1="155" x2="158" y2="155" class="arw"/>
<line x1="280" y1="140" x2="310" y2="140" class="arw"/>
<line x1="280" y1="170" x2="310" y2="170" class="arw"/>
<line x1="462" y1="140" x2="492" y2="140" class="arw"/>
<line x1="462" y1="170" x2="492" y2="170" class="arw"/>
<line x1="644" y1="155" x2="674" y2="155" class="arw"/>
<line x1="569" y1="86" x2="569" y2="80" class="ln"/>
<line x1="569" y1="80" x2="736" y2="80" class="ln"/>
<line x1="736" y1="80" x2="736" y2="78" class="arw"/>
<text class="sm" x="640" y="76" text-anchor="middle">payload DMA</text>
<text class="sm" x="600" y="250" text-anchor="middle">RX: MAC writes FIFO slots, CPU consumes through 0x09c0_0604/0608</text>
<text class="sm" x="600" y="266" text-anchor="middle">TX: CPU builds descriptors in packet SRAM, MAC fetches through 0x09c6_xxxx rings</text>
<text class="sm" x="600" y="282" text-anchor="middle">HIF: CPU publishes descriptors at 0x0ab0_0000 / 0x0ab0_0100, host DMA reads buffers</text>
</svg>
