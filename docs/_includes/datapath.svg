<svg class="datapath" viewBox="0 0 960 400" role="img" aria-labelledby="dp-title" xmlns="http://www.w3.org/2000/svg"><title id="dp-title">Data path: the host reaches packet SRAM through the HIF; the MAC moves frames between packet SRAM and the PHY; the AES engine works on packet SRAM; the CPU programs every block and builds descriptors.</title><defs><marker id="dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dp-head"/></marker></defs><g class="dp-cpu"><rect x="300" y="14" width="360" height="74" rx="8"/><text x="480" y="44" class="dp-t">CPU · ARM966E-S</text><text x="480" y="66" class="dp-s">ITCM 0x0000_0000 · DTCM 0x0400_0000</text></g><g class="dp-box"><rect x="16" y="168" width="150" height="96" rx="8"/><text x="91" y="204" class="dp-t">Host</text><text x="91" y="226" class="dp-s">cw1200 driver</text><text x="91" y="244" class="dp-s">over SDIO</text></g><g class="dp-box dp-key"><rect x="216" y="160" width="160" height="112" rx="8"/><text x="296" y="190" class="dp-t">HIF</text><text x="296" y="212" class="dp-s">0x0ab0_0000</text><text x="296" y="232" class="dp-s">input ring × 32</text><text x="296" y="250" class="dp-s">output ring × 4</text></g><g class="dp-box dp-key"><rect x="426" y="140" width="170" height="152" rx="8"/><text x="511" y="170" class="dp-t">Packet SRAM</text><text x="511" y="194" class="dp-s">0x0900_7000 pool</text><text x="511" y="212" class="dp-s">host buffers</text><text x="511" y="230" class="dp-s">TX commands</text><text x="511" y="248" class="dp-s">rate RAM</text><text x="511" y="274" class="dp-s">0x0940_0000 RX FIFO</text></g><g class="dp-box dp-key"><rect x="646" y="140" width="160" height="152" rx="8"/><text x="726" y="170" class="dp-t">MAC</text><text x="726" y="194" class="dp-s">0x09c0_0000</text><text x="726" y="212" class="dp-s">receive DMA</text><text x="726" y="230" class="dp-s">4 TX pipes</text><text x="726" y="248" class="dp-s">response engine</text><text x="726" y="266" class="dp-s">event FIFO</text></g><g class="dp-box"><rect x="836" y="168" width="116" height="96" rx="8"/><text x="894" y="204" class="dp-t">PHY · RF</text><text x="894" y="226" class="dp-s">0x0ab8_0000</text><text x="894" y="244" class="dp-s">2.4 GHz</text></g><g class="dp-box"><rect x="426" y="330" width="170" height="56" rx="8"/><text x="511" y="355" class="dp-t">AES engine</text><text x="511" y="374" class="dp-s">0x09c5_0000 · CCMP</text></g><g class="dp-flow"><path d="M166 216H212" marker-end="url(#dp-arrow)" marker-start="url(#dp-arrow)"/><path d="M376 216H422" marker-end="url(#dp-arrow)" marker-start="url(#dp-arrow)"/><path d="M596 216H642" marker-end="url(#dp-arrow)" marker-start="url(#dp-arrow)"/><path d="M806 216H832" marker-end="url(#dp-arrow)" marker-start="url(#dp-arrow)"/><path d="M511 292V326" marker-end="url(#dp-arrow)" marker-start="url(#dp-arrow)"/></g><g class="dp-ctl"><path d="M380 88L300 156" marker-end="url(#dp-arrow)"/><path d="M480 88L505 136" marker-end="url(#dp-arrow)"/><path d="M580 88L710 136" marker-end="url(#dp-arrow)"/><path d="M621 88V340Q621 358 603 358" marker-end="url(#dp-arrow)"/><text x="268" y="122" class="dp-s dp-l">registers</text><text x="530" y="118" class="dp-s dp-l">descriptors</text><text x="676" y="108" class="dp-s dp-l">registers</text><text x="626" y="318" class="dp-s dp-l">registers</text></g><g class="dp-label"><text x="189" y="206" class="dp-s">SDIO</text><text x="399" y="206" class="dp-s">DMA</text><text x="619" y="206" class="dp-s">DMA</text><text x="528" y="314" class="dp-s dp-l">DMA</text></g></svg>
