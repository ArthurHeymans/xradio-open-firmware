name: Firmware checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  xr819:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p xtask --all-targets -- -D warnings
      - run: cargo clippy --locked -p xr819-firmware --lib --tests
      # The two firmware executables target different ARM ISAs; xtask builds
      # them below. Build the firmware library and the host packer natively.
      - run: cargo build --locked --workspace --lib --bin xtask
      - run: cargo test --locked --workspace
      - run: cargo xtask check
      - run: cargo xtask image
      - name: Record checksums
        working-directory: target/images
        run: sha256sum boot_xr819.bin fw_xr819.bin > SHA256SUMS
      - name: Upload tested images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xr819-${{ github.sha }}
          path: |
            target/images/boot_xr819.bin
            target/images/fw_xr819.bin
            target/images/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
